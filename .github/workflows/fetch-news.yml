name: Fetch Action News

on:
  schedule:
    - cron: '*/30 * * * *'   # elke 30 minuten
  workflow_dispatch:          # handmatig starten via GitHub UI

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch news
        run: node scripts/fetch-news.js

      - name: Commit news.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/news.json
          git diff --staged --quiet && echo "No changes" || \
            (git commit -m "chore: update news.json [skip ci]" && git push)
